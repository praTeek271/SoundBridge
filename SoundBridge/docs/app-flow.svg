<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1a2333" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35" />
    </filter>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="940" height="580" rx="16" fill="url(#flowBg)" />

  <!-- Title -->
  <text x="470" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">APPLICATION NAVIGATION &amp; ROUTING LIFECYCLE</text>

  <!-- Node 1: Launch -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="65" width="230" height="60" rx="10" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="165" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">1. Launch SoundBridge</text>
    <text x="165" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Scan WASAPI Audio Endpoints</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="280" y1="95" x2="350" y2="95" stroke="#38bdf8" stroke-width="2" marker-end="url(#flowArrow)" />

  <!-- Node 2: Devices Page -->
  <g filter="url(#cardShadow)">
    <rect x="350" y="65" width="250" height="60" rx="10" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="475" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">2. Devices Dashboard</text>
    <text x="475" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">View Default Device &amp; Status</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="600" y1="95" x2="670" y2="95" stroke="#38bdf8" stroke-width="2" marker-end="url(#flowArrow)" />

  <!-- Node 3: Template Selection / Add -->
  <g filter="url(#cardShadow)">
    <rect x="670" y="65" width="220" height="60" rx="10" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="1.5" />
    <text x="780" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">Select or Create (+)</text>
    <text x="780" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#a5b4fc" text-anchor="middle">Multi-Output Template</text>
  </g>

  <!-- Arrow 3 down to Workspace Container -->
  <path d="M 780 125 L 780 165 L 530 165" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#flowArrow)" />

  <!-- Container: Workspace Configuration -->
  <rect x="50" y="190" width="840" height="135" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-dasharray="4" />
  <text x="70" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">DEVICE WORKSPACE CONFIGURATION</text>

  <!-- Config Steps Inside Container -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="230" width="230" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="185" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">Pick Source Device</text>
    <text x="185" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Virtual Device or Hardware</text>

    <line x1="300" y1="265" x2="340" y2="265" stroke="#94a3b8" stroke-width="2" marker-end="url(#flowArrow)" />

    <rect x="340" y="230" width="250" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="465" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">Select Output Sinks</text>
    <text x="465" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Per-output Volume &amp; Delay (ms)</text>

    <line x1="590" y1="265" x2="630" y2="265" stroke="#94a3b8" stroke-width="2" marker-end="url(#flowArrow)" />

    <rect x="630" y="230" width="240" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="750" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Apply Configuration</text>
    <text x="750" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Auto-navigates to Calibration ➔</text>
  </g>

  <!-- Arrow down from Container to Calibration -->
  <line x1="750" y1="325" x2="750" y2="365" stroke="#38bdf8" stroke-width="2" marker-end="url(#flowArrow)" />

  <!-- Node 4: Calibration Page -->
  <g filter="url(#cardShadow)">
    <rect x="520" y="365" width="370" height="75" rx="10" fill="url(#cardGrad1)" stroke="#34d399" stroke-width="1.5" />
    <text x="705" y="393" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">CALIBRATION &amp; TEST CONTROLS</text>
    <text x="705" y="413" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">Play Test Beeps · Verify Sync Across Sinks</text>
    <text x="705" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Click "Start Routing" (OK)</text>
  </g>

  <!-- Arrow left from Calibration to Active Routing -->
  <line x1="520" y1="402" x2="400" y2="402" stroke="#34d399" stroke-width="2" marker-end="url(#flowArrow)" />

  <!-- Node 5: Active Routing State -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="360" width="350" height="85" rx="12" fill="url(#activeGrad)" stroke="#10b981" stroke-width="2" />
    <text x="225" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">AUDIO ROUTING ACTIVE ⚡</text>
    <text x="225" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ecfdf5" text-anchor="middle">Live VU Peak Meters · 120ms Polling Tick</text>
    <text x="225" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#d1fae5" text-anchor="middle">Audio flows synchronously to all outputs</text>
  </g>

  <!-- Arrow down from Active to System Tray -->
  <line x1="225" y1="445" x2="225" y2="485" stroke="#10b981" stroke-width="2" marker-end="url(#flowArrow)" />

  <!-- Node 6: Background System Tray -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="485" width="840" height="55" rx="10" fill="url(#cardGrad1)" stroke="#64748b" stroke-width="1" />
    <text x="470" y="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">🔔 SYSTEM TRAY BACKGROUND OPERATION</text>
    <text x="470" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Minimize to system tray · Right-click tray menu to Stop Routing, Restore Window, or Exit Cleanly</text>
  </g>
</svg>
